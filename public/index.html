<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Recordings - TrackBack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: white;
            font-size: 28px;
        }

        .nav-btn {
            background: rgba(74, 144, 217, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: rgba(74, 144, 217, 1);
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: #aaa;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 16px;
            word-break: break-all;
        }

        .card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .timestamp {
            background: rgba(74, 144, 217, 0.1);
            color: #4a90d9;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            display: inline-block;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🎵 All Recordings</h1>
            <a href="/add-recording.html" class="nav-btn">➕ Add New Recording</a>
        </header>

        <div id="stats" class="stats"></div>
        <div id="grid" class="grid"></div>
    </div>

    <script>
        let recordings = [];

        console.log('index.html')

        async function loadRecordings() {
            try {
                const res = await fetch('/recordings');
                if (!res.ok) return;
                recordings = await res.json();
                renderRecordings();
            } catch (err) {
                console.error(err);
            }
        }

        function renderRecordings() {
            const grid = document.getElementById('grid');
            const stats = document.getElementById('stats');

            if (!recordings || recordings.length === 0) {
                grid.innerHTML = '<div class="empty-state"><h2>No recordings yet</h2><p>Click "Add New Recording" to get started!</p></div>';
                stats.innerHTML = '';
                return;
            }

            grid.innerHTML = recordings.map(r => `
                <div class="card">
                    <h3><a href="${r.youtube_link}" target="_blank" style="color: #4a90d9;">${r.youtube_link.replace(/^https?:\/\//, '')}</a></h3>
                    <span class="timestamp">${r.timestamp || '00:00'}</span>
                    ${r.notes ? `<p>${r.notes}</p>` : ''}
                    <p style="color: #999; font-size: 12px;">Added: ${new Date(r.created_at).toLocaleDateString()}</p>
                    <button class="delete-btn" onclick="deleteRecording('${r.id}')">Delete</button>
                </div>
            `).join('');

            stats.innerHTML = `<span>${recordings.length} recording${recordings.length !== 1 ? 's' : ''}</span>`;
        }

        async function deleteRecording(id) {
            if (!confirm('Delete this recording?')) return;
            try {
                const res = await fetch(`/recordings/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadRecordings();
                } else {
                    alert('Failed to delete');
                }
            } catch (err) {
                console.error(err);
                alert('Network error');
            }
        }

        loadRecordings();
    </script>
</body>

</html>
